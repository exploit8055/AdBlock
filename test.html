<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Growing Polygon Bounce</title>
<style>
    body { margin: 0; background: #111; overflow: hidden; }
    canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let center = { x: canvas.width / 2, y: canvas.height / 2 };
let radius = 250;

let sides = 3;
let speedMultiplier = 1.1;

let ball = {
    x: center.x,
    y: center.y,
    radius: 8,
    vx: 3,
    vy: 2
};

function getPolygonVertices(cx, cy, r, sides) {
    const vertices = [];
    const angleStep = (Math.PI * 2) / sides;
    const startAngle = -Math.PI / 2;
    for (let i = 0; i < sides; i++) {
        const angle = startAngle + i * angleStep;
        vertices.push({
            x: cx + r * Math.cos(angle),
            y: cy + r * Math.sin(angle)
        });
    }
    return vertices;
}

function reflectVelocity(normalX, normalY) {
    const dot = ball.vx * normalX + ball.vy * normalY;
    ball.vx -= 2 * dot * normalX;
    ball.vy -= 2 * dot * normalY;
}

function checkCollision(vertices) {
    for (let i = 0; i < vertices.length; i++) {
        const v1 = vertices[i];
        const v2 = vertices[(i + 1) % vertices.length];

        const edgeX = v2.x - v1.x;
        const edgeY = v2.y - v1.y;

        const length = Math.hypot(edgeX, edgeY);
        const normalX = -edgeY / length;
        const normalY = edgeX / length;

        const dx = ball.x - v1.x;
        const dy = ball.y - v1.y;
        const dist = dx * normalX + dy * normalY;

        if (dist > -ball.radius) {
            reflectVelocity(normalX, normalY);

            ball.vx *= speedMultiplier;
            ball.vy *= speedMultiplier;

            sides += 1;

            return true;
        }
    }
    return false;
}

function drawPolygon(vertices) {
    ctx.beginPath();
    ctx.moveTo(vertices[0].x, vertices[0].y);
    for (let i = 1; i < vertices.length; i++) {
        ctx.lineTo(vertices[i].x, vertices[i].y);
    }
    ctx.closePath();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#00ffcc";
    ctx.fill();
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const vertices = getPolygonVertices(center.x, center.y, radius, sides);

    ball.x += ball.vx;
    ball.y += ball.vy;

    checkCollision(vertices);

    drawPolygon(vertices);
    drawBall();

    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
